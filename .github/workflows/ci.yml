name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: llm-math
        working-directory: llm-math
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test

      - name: mcp
        working-directory: mcp
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t vram-mcp .

      - name: Answer over stdio
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1.0.0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"can_i_run","arguments":{"model":"llama-3.3-70b","gpu":"rtx-4090"}}}' \
            | timeout 30 docker run -i --rm vram-mcp > out.jsonl || true
          cat out.jsonl
          grep -q '"name":"can_i_run"' out.jsonl
          grep -q '45.8 GB' out.jsonl
